; Spooky Radio: a Launcher-bootable demo of the ESP32-S3's odd sensing and radio tricks on the Cardputer ADV.
; Three firmwares share this project:
;   spooky   -> spooky-radio.bin   (the Cardputer app, every demo except MIDI)
;   midi     -> spooky-midi.bin    (Cardputer as a USB MIDI instrument; native USB mode)
;   partner-*-> spooky-partner.bin (any spare ESP32 / ESP32-S3: CSI sender, ESP-NOW echo, FTM responder, beacons)

[platformio]
default_envs = spooky

[cardputer]
platform = espressif32@6.7.0
board = m5stack-stamps3
framework = arduino
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
    m5stack/M5Cardputer@1.1.1

[env:spooky]
extends = cardputer
build_src_filter = +<app/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -Isrc/common
lib_deps =
    ${cardputer.lib_deps}
    h2zero/NimBLE-Arduino@1.4.3

; USB OTG (TinyUSB) mode so the Cardputer can enumerate as a MIDI device. CDC_ON_BOOT is off so the MIDI interface
; is registered before USB starts; the sketch adds its own CDC serial afterwards. If a crash leaves no serial port,
; hold G0 while switching on to get download mode.
[env:midi]
extends = cardputer
build_src_filter = +<midi/>
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -Isrc/common

[partner]
platform = espressif32@6.7.0
framework = arduino
monitor_speed = 115200
build_src_filter = +<partner/>
lib_deps =
    h2zero/NimBLE-Arduino@1.4.3
    z3t0/IRremote@4.4.1

[env:partner-esp32]
extends = partner
board = esp32dev
build_flags = -Isrc/common

[env:partner-s3]
extends = partner
board = esp32-s3-devkitc-1
build_flags =
    -Isrc/common
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
